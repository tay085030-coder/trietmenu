<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🔥 TRIẾT GAMING 🔥</title>

<meta name="theme-color" content="#ff0000">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050505;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;

}

.card{

width:360px;
background:#111;
border:2px solid red;
border-radius:20px;
padding:20px;
box-shadow:0 0 30px red;

}

h1{

text-align:center;
color:#ff2d2d;
text-shadow:0 0 15px red;

}

.subtitle{

text-align:center;
color:#aaa;
margin:10px 0 20px;

}

.item{

display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
margin:12px 0;
background:#181818;
border:1px solid #ff3333;
border-radius:15px;

}

.switch{

position:relative;
width:55px;
height:30px;

}

.switch input{

display:none;

}

.slider{

position:absolute;
inset:0;
background:#444;
border-radius:30px;
cursor:pointer;
transition:.3s;

}

.slider:before{

content:"";
position:absolute;
width:24px;
height:24px;
background:white;
left:3px;
top:3px;
border-radius:50%;
transition:.3s;

}

input:checked + .slider{

background:red;

}

input:checked + .slider:before{

transform:translateX(25px);

}

button{

width:100%;
margin-top:10px;
padding:12px;
background:red;
color:white;
border:none;
border-radius:12px;
font-size:16px;

}

button:active{

transform:scale(.98);

}

#status{

margin-top:20px;
padding:15px;
background:#0d0d0d;
border-radius:12px;
text-align:center;
color:#00ff88;

}

.footer{

margin-top:20px;
text-align:center;
font-size:13px;
color:#777;

}

</style>

</head>

<body>

<div class="card">

<h1>🔥 TRIẾT GAMING 🔥</h1>

<div class="subtitle">

WEB CLIP GAMING 2026

</div>

<div class="item">

<span>🎮 Gaming Mode</span>

<label class="switch">

<input id="gaming" type="checkbox">

<span class="slider"></span>

</label>

</div>

<div class="item">

<span>📱 Device Check</span>

<label class="switch">

<input id="device" type="checkbox">

<span class="slider"></span>

</label>

</div>

<div class="item">

<span>🔋 Battery Monitor</span>

<label class="switch">

<input id="battery" type="checkbox">

<span class="slider"></span>

</label>

</div>

<div class="item">

<span>📶 Network Check</span>

<label class="switch">

<input id="network" type="checkbox">

<span class="slider"></span>

</label>

</div>

<button onclick="savePreset()">

💾 SAVE PRESET

</button>

<button onclick="shareMenu()">

📤 CHIA SẺ MENU

</button>

<button onclick="deviceInfo()">

📱 THÔNG TIN THIẾT BỊ

</button>

<div id="status">

⚡ Sẵn sàng trải nghiệm Gaming

</div>

<div class="footer">

🏆 TRIẾT GAMING MENU © 2026

</div>

</div>

<script>

const ids=["gaming","device","battery","network"];

ids.forEach(id=>{

const sw=document.getElementById(id);

sw.checked=localStorage.getItem(id)=="1";

sw.onchange=()=>{

localStorage.setItem(id,sw.checked?"1":"0");

status.innerHTML=id.toUpperCase()+" "+(sw.checked?"ON ✅":"OFF ❌");

}

});

async function deviceInfo(){

status.innerHTML=

"📱 "+navigator.platform+

"<br>"+navigator.userAgent;

if(navigator.getBattery){

const b=await navigator.getBattery();

status.innerHTML+="<br>🔋 "+Math.round(b.level*100)+"%";

}

status.innerHTML+="<br>"+(navigator.onLine?"📶 Online":"❌ Offline");

}

function savePreset(){

localStorage.setItem("preset","saved");

status.innerHTML="💾 Đã lưu Preset";

}

async function shareMenu(){

if(navigator.share){

await navigator.share({

title:"TRIẾT GAMING",

text:"🔥 TRIẾT GAMING WEB CLIP GAMING",

url:location.href

});

}else{

status.innerHTML="❌ Trình duyệt không hỗ trợ chia sẻ";

}

}

</script>

</body>
</html>
