<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIẾT GAMING NEON V8</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.panel{
width:360px;
background:#111;
border:2px solid #ff0000;
border-radius:20px;
padding:20px;
box-shadow:0 0 25px red;
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff3b3b;
text-shadow:0 0 15px red;
margin-bottom:5px;
}

.version{
text-align:center;
color:#888;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#191919;
padding:15px;
margin:12px 0;
border-radius:15px;
border:1px solid #ff3333;
transition:.3s;
}

.item:hover{
box-shadow:0 0 15px red;
}

.switch{
position:relative;
width:58px;
height:30px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#444;
border-radius:30px;
transition:.3s;
}

.slider:before{
position:absolute;
content:"";
height:24px;
width:24px;
left:3px;
bottom:3px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked+.slider{
background:#ff0000;
}

input:checked+.slider:before{
transform:translateX(28px);
}

.status{
text-align:center;
margin-top:20px;
font-size:18px;
color:#00ff66;
}

.footer{
margin-top:18px;
text-align:center;
color:#777;
font-size:13px;
}

.circle{
margin:20px auto;
width:90px;
height:90px;
border:3px solid #ff0000;
border-radius:50%;
box-shadow:0 0 25px red;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
color:#ff0000;
animation:pulse 1.8s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.08);
box-shadow:0 0 35px #ff0000;
}
}
</style>

</head>
<body>

<div class="panel">

<div class="logo">
TRIẾT GAMING
</div>

<div class="version">
NEON V8
</div>

<div class="circle">
⭕
</div>

<div class="item">
<span>🎯 AIM ĐẦU</span>

<label class="switch">
<input type="checkbox" id="aim">
<span class="slider"></span>
</label>

</div>

<div class="item">
<span>💊 FIX RUNG</span>

<label class="switch">
<input type="checkbox" id="fix">
<span class="slider"></span>
</label>

</div>

<div class="item">
<span>⚡ NHẸ TÂM</span>

<label class="switch">
<input type="checkbox" id="light">
<span class="slider"></span>
</label>

</div>

<div class="item">
<span>🎮 GIAO DIỆN NEON</span>

<label class="switch">
<input type="checkbox" id="theme" checked>
<span class="slider"></span>
</label>

</div>

<div class="status" id="status">
Sẵn sàng
</div>

<div class="footer">
TRIẾT GAMING © 2026
</div>

</div>

<script>

const ids=["aim","fix","light","theme"];

ids.forEach(id=>{

const sw=document.getElementById(id);

sw.checked=localStorage.getItem(id)=="1";

sw.addEventListener("change",()=>{

localStorage.setItem(id,sw.checked?"1":"0");

document.getElementById("status").innerHTML=
sw.checked
? id.toUpperCase()+" : ON ✅"
: id.toUpperCase()+" : OFF ❌";

});

});

</script>

</body>
</html>
